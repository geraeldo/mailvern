[package]
name = "mailvern"
version = "0.2.1"
edition = "2021"
license = "MIT"

[lib]
name = "mailvern_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mail-core = { path = "../crates/mail-core" }
mail-mcp = { path = "../crates/mail-mcp" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
dirs = "6"
anyhow = "1"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "gzip"] }
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
